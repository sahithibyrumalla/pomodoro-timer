<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="container">

        <h1>POMODORO</h1>

        <div class="timer-box">

        <h2 id="timer">25:00</h2>
        <img id="active-cat" src="active-cat.gif">
        <img id="break-cat" src="sleeping-cat.gif">
        <img id="pause-cat" src="pause-cat.gif">
        <button id="start-btn">START</button>

         <div class ="controls">
                <button id="reset-btn">RESET</button>
                <button id="pause-btn">PAUSE</button>
                
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
